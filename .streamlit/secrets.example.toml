# Ejemplo de secretos para la app de ventas (s08-dashboards/practica-ventas/app.py).
#
# En local: copia este archivo como .streamlit/secrets.toml (está en .gitignore,
# nunca se sube al repositorio) y cambia los valores.
# En Streamlit Community Cloud: pega el contenido en el campo "Secrets" de la
# configuración avanzada al desplegar, o después en Settings -> Secrets.
#
# Sin este archivo la app funciona en modo demostración, con las reglas de
# ejemplo de seguridad.py y el selector "Ver como (solo demo)".

# ---------------------------------------------------------------------------
# Seguridad por filas estática: cada rol ve una lista fija de países
# ---------------------------------------------------------------------------
[roles]
NAFTA = ["US", "CANADA", "MEXICO"]
SUDAMERICA = ["BRAZIL", "COLOMBIA", "CHILE", "PERU"]
EUROPA = ["SPAIN", "PORTUGAL", "FRANCE"]

# Qué correos pertenecen a cada rol (lo que en una herramienta de BI se hace al
# asignar personas a un rol en el servicio). Un correo puede estar en varios roles:
# ve la unión de sus países.
[miembros]
NAFTA = ["ana@empresa.com"]
EUROPA = []

# ---------------------------------------------------------------------------
# Seguridad por filas dinámica: tabla correo -> países
# ---------------------------------------------------------------------------
# El correo se compara con st.user.email (sin distinguir mayúsculas). Para dar
# acceso a alguien basta con añadir una línea; no hay que tocar los roles.
[usuarios]
"marta@empresa.com" = ["SPAIN", "PORTUGAL", "FRANCE"]
"jorge@empresa.com" = ["US", "MEXICO"]

# Quién ve todos los países sin restricción
[acceso]
administradores = ["direccion@empresa.com"]

# ---------------------------------------------------------------------------
# Inicio de sesión (modo producción). Descomenta y completa con los datos de tu
# proveedor OIDC (Google, Microsoft Entra ID, Auth0, Okta...). Con esta sección,
# la app pide iniciar sesión con st.login() y desaparece el selector "Ver como".
# Requiere instalar streamlit[auth] (ver requirements.txt).
# ---------------------------------------------------------------------------
# [auth]
# redirect_uri = "https://tu-app.streamlit.app/oauth2callback"   # en local: http://localhost:8501/oauth2callback
# cookie_secret = "una-cadena-larga-y-aleatoria"
# client_id = "..."
# client_secret = "..."
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
