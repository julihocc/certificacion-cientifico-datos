[project]
name = "ebac-cientifico-datos"
version = "0.1.0"
description = "Projects and exercises from the EBAC Data Scientist Program"
requires-python = ">=3.11"
dependencies = [
    "feature-engine>=1.9.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "numpy>=2.4.6",
    "orange3>=3.39.0",
    # Notebooks were written for pandas 2.x and statsmodels 0.14; newer majors break them.
    "pandas>=2.2,<3",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14,<0.15",
    "xgboost>=2.0.3",
    "yfinance>=1.7.0",
]
